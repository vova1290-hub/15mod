<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <form id="film-form">
        <label for="title">Название:</label><br>
        <input type="text" id="title" name="title"><br>
        <label for="genre">Жанр:</label><br>
        <input type="text" id="genre" name="genre"><br>
        <label for="releaseYear">Год:</label><br>
        <input type="text" id="releaseYear" name="releaseYear"><br>
        <input type="checkbox" id="isWatched" name="isWatched">
        <label for="isWatched">Успели посмотреть?</label><br>
        <input type="submit" value="Submit">
    </form>
    <div class="wrapper">
        <div class="filters">
            <input type="text" id="titleFilter" placeholder="Название фильма">
            <input type="text" id="genreFilter" placeholder="Жанр">
            <input type="text" id="yearFilter" placeholder="Год релиза">
            <select id="watchedFilter">
                <option value="">Все</option>
                <option value="true">Просмотрено</option>
                <option value="false">Не просмотрено</option>
            </select>
        </div>
        <button class="delete-btn" onclick="deleteAllFilm()">Удалить Все</button>
    </div>
    <table id="film-table">
        <thead>
            <tr>
                <th>Название</th>
                <th>Жанр</th>
                <th>Год</th>
                <th>Успели посмотреть?</th>
                <th>Действие</th>
            </tr>
        </thead>
        <tbody id="film-tbody">
            
        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
